trigger:
  branches:
    include:
      - master

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: adb-prod-global-soc-variable-group

stages:
  - stage: QualityChecks
    displayName: Code quality checks

    jobs:
      - job: CheckPython
        displayName: Check Python sources

        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: "3.11"

          - script: |
              set -e

              python -m compileall src
            displayName: Validate Python syntax

  - stage: Validate
    displayName: Validate GSOC bundle
    dependsOn: QualityChecks
    condition: succeeded()

    jobs:
      - job: ValidateBundle
        displayName: Validate Databricks bundle
        

        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: |
              set -e

              curl -fsSL \
                https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
                | sh

              databricks version
            displayName: Install Databricks CLI

          - script: |
              set -e

              echo "Databricks identity:"
              databricks current-user me -t prod

              echo "Validating PROD bundle:"
              databricks bundle validate -t prod
              
              echo "PROD bundle summary:"
              databricks bundle summary -t prod
            displayName: Validate PROD bundle
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - stage: DeployProd
    displayName: Deploy GSOC to PROD
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - deployment: DeployDatabricksProd
        displayName: Deploy bundle to Databricks PROD
        environment: databricks_prod

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 0

                - script: |
                    set -e

                    curl -fsSL \
                      https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
                      | sh

                    databricks version
                  displayName: Install Databricks CLI

                - script: |
                    set -e

                    echo "Databricks identity:"
                    databricks current-user me -t prod

                    echo "Bundle summary:"
                    databricks bundle summary -t prod

                    echo "Deploying GSOC to PROD:"
                    databricks bundle deploy \
                      -t prod \
                      --auto-approve
                  displayName: Deploy PROD bundle
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)