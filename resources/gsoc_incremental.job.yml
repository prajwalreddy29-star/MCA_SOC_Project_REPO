resources:
  jobs:
    GSOC_CDP_Incremental_Load:
      name: GSOC_CDP_Incremental Load
      schedule:
        quartz_cron_expression: 0 30 0,12 * * ?
        timezone_id: Europe/Paris
        pause_status: ${var.schedule_pause_status}
      tasks:
        - task_key: Bronze_Incremental_Load
          notebook_task:
            notebook_path: ../notebooks/ingestion/cdp_incremental_load.py
            source: WORKSPACE
          job_cluster_key: Incremental_Load_cluster
        - task_key: Silver_Incremental_Load
          depends_on:
            - task_key: Bronze_Incremental_Load
          notebook_task:
            notebook_path: ../notebooks/ingestion/silver_incremental.py
            source: WORKSPACE
          job_cluster_key: Incremental_Load_cluster
        - task_key: Restriction_Change_Load
          depends_on:
            - task_key: Silver_Incremental_Load
          notebook_task:
            notebook_path: ../notebooks/ingestion/restriction_load.py
            source: WORKSPACE
          job_cluster_key: Incremental_Load_cluster
      job_clusters:
        - job_cluster_key: Incremental_Load_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: -1
            node_type_id: Standard_DS3_v2
            driver_node_type_id: Standard_DS3_v2
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
      max_concurrent_runs: 1
      queue:
        enabled: false
      parameters:
        - name: environment
          default: ${var.environment}
